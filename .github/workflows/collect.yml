name: collect
on:
  schedule:
    - cron: "17 */6 * * *"   # 하루 4회 (UTC 0/6/12/18시 17분)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python collector/collect.py
      - name: 지표 계산
        run: python collector/compute.py
      - name: 데이터 커밋
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F\ %H:%M) UTC"
          git pull --rebase -q || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
